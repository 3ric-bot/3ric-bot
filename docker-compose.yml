version: "3.9"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATA_STORE_DRIVER: journaled
      DATA_STORE_PATH: /data/state.json
    volumes:
      - learnzo_state:/data
    expose:
      - "4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./site
      args:
        API_BASE_URL: ${API_BASE_URL:-https://learnzo.localhost/api}
        SITE_BASE_URL: ${SITE_BASE_URL:-https://learnzo.localhost}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2.7
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-learnzo.localhost}
      API_UPSTREAM: http://backend:4000
      FRONTEND_UPSTREAM: http://frontend
      CADDY_ADMIN_EMAIL: ${CADDY_ADMIN_EMAIL:-ops@learnzo.io}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  learnzo_state:
  caddy_data:
  caddy_config:
